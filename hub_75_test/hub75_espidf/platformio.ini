; HUB75 test — ESP-IDF (no Arduino) on a plain ESP32 devkit + one 64x32 FM6124 panel.
;
;   Build:    pio run
;   Flash:    pio run -t upload
;   Monitor:  pio device monitor
;
; Close the Arduino IDE (and any serial monitor) first — it holds the COM port.

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = espidf

; --- Serial / flashing ---------------------------------------------------
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; 115200 is slower than the 921600 Arduino default but far more forgiving
; on a marginal cable/board. Raise to 460800/921600 once flashing is solid.
upload_speed = 115200
; Auto-detects the port. To pin it, uncomment:
;upload_port = COM4
;monitor_port = COM4

; --- Build ---------------------------------------------------------------
; NO_GFX: build the HUB75 library without Adafruit GFX / Arduino, so it
; compiles against bare ESP-IDF. The vendored copy lives in lib/.
build_flags =
    -DNO_GFX
